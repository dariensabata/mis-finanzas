<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis finanzas</title><link rel="manifest" href="./manifest.json"><link rel="icon" type="image/png" href="./icon.png"><link rel="apple-touch-icon" href="./icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --soft:#EBEFF4; --ink:#0F1A2E; --muted:#56637A; --line:#DAE1EA;
  --accent:#2344C9; --accent-ink:#FFFFFF; --inc:#0B7A5A; --exp:#C23B3B; --eq:#2D5BD0; --warn:#8A5C00;
  --inc-bg:#E1F3EC; --exp-bg:#FBE9E9;
  --c1:#2B59D6; --c2:#B7791F; --c3:#0F8F73;
  --td:#F2B33D; --td-ink:#3B2A00; --tn:#3C3F9C; --tn-ink:#FFFFFF; --tl:#1E7F5C; --tl-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(23,32,51,.06);
  --f-head:'Sora','Segoe UI',system-ui,sans-serif;
  --f-body:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A101C; --surface:#111B2E; --soft:#17233A; --ink:#E8EDF7; --muted:#97A5BF; --line:#22324D;
    --accent:#7F9AFF; --accent-ink:#0A101C; --inc:#4CC9A0; --exp:#FF8A80; --eq:#8FB0FF; --warn:#E3B341;
    --inc-bg:#12332B; --exp-bg:#3A1F25;
    --c1:#8FB0FF; --c2:#E3B341; --c3:#4CC9A0;
    --td:#D9A12E; --td-ink:#1F1600; --tn:#7B80EA; --tn-ink:#0E1420; --tl:#3DB88A; --tl-ink:#08130F;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A101C; --surface:#111B2E; --soft:#17233A; --ink:#E8EDF7; --muted:#97A5BF; --line:#22324D;
  --accent:#7F9AFF; --accent-ink:#0A101C; --inc:#4CC9A0; --exp:#FF8A80; --eq:#8FB0FF; --warn:#E3B341;
  --inc-bg:#12332B; --exp-bg:#3A1F25;
  --c1:#8FB0FF; --c2:#E3B341; --c3:#4CC9A0;
  --td:#D9A12E; --td-ink:#1F1600; --tn:#7B80EA; --tn-ink:#0E1420; --tl:#3DB88A; --tl-ink:#08130F;
  --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tx-amt,td.n,th.n,.hero-num{font-variant-numeric:tabular-nums}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{font-family:var(--f-head);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0;flex:1}
.period{display:flex;align-items:center;gap:6px;order:3;width:100%}
.period select[data-c=pmes]{flex:1;min-width:0}
@media(min-width:720px){.period{order:0;width:auto}.period select[data-c=pmes]{flex:none}}
.period select,.period input.yr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px;min-height:40px}
.period input.yr{width:80px;text-align:center}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:20px;height:20px}
.info-btn{flex:none;width:32px;height:32px;padding:0;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.info-btn svg{width:18px;height:18px}
.info-btn:hover{color:var(--accent);border-color:var(--accent)}
.kv4 .info-btn{margin-left:4px;vertical-align:middle}
.info-sm{width:26px;height:26px}
.info-sm svg{width:15px;height:15px}
.lblrow{display:flex;align-items:center;gap:8px}
.catinfo{display:grid;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.catinfo b{display:block;color:var(--ink);font-size:13px;font-weight:600;margin-bottom:1px}
.status{max-width:980px;margin:0 auto;padding:6px 16px;font-size:12.5px;color:var(--muted)}
.status.warn{color:var(--warn)}

main{max-width:980px;margin:0 auto;padding:14px 16px 120px}
section.card,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-family:var(--f-head);font-size:17px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.inc{color:var(--inc)} .exp{color:var(--exp)} .eqc{color:var(--eq)} .good{color:var(--inc)} .bad{color:var(--exp)}

/* Hero */
.hero{padding:18px 16px 16px}
.hero-label{margin:0;color:var(--muted);font-size:14px}
.hero-num{font-family:var(--f-head);font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.05;letter-spacing:-.025em;margin:4px 0 14px}
.hero-sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.gl{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.gl{grid-template-columns:1fr 1fr;gap:24px}}
.gl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.gl-h b{font-weight:600}
.gauge{position:relative;height:12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:visible}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.gauge i.inc{background:var(--inc)} .gauge i.exp{background:var(--exp)} .gauge i.eq{background:var(--eq)} .gauge i.warn{background:var(--warn)}
.gauge b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.kv{display:grid;grid-template-columns:auto auto auto;justify-content:space-between;gap:4px 10px;margin-top:8px;font-size:13px}
.kv span{display:block;color:var(--muted)} .kv strong{font-weight:600}

/* Tablas */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:4px 0 6px;font-size:12.5px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl td:first-child{white-space:normal;padding-right:8px}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);padding-top:10px}
.tbl td.n{padding-left:6px}
.scroll{overflow-x:auto;max-width:100%}

/* Detalle por categoría */
details.cat{border-top:1px solid var(--line);padding:2px 0}
details.cat:first-of-type{border-top:0}
details.cat>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;cursor:pointer;min-height:44px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary::before{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px;flex:none}
details.cat[open]>summary::before{transform:rotate(45deg)}
details.cat>summary .sn{flex:1;font-weight:600}
details.cat>summary .sv{font-size:13px;color:var(--muted);text-align:right}
.cpb{height:6px;border-radius:9px;background:var(--soft);margin-top:4px;overflow:hidden;min-width:60px}
.cpb i{display:block;height:100%;background:var(--inc)} .cpb i.over{background:var(--exp)}

/* Regla */
.rule{display:grid;gap:10px}
.rule-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.rule-row .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.pct{display:inline-block;min-width:54px;text-align:center;font-weight:700;color:var(--accent);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.rule-row .am{font-weight:700;font-family:var(--f-head);font-size:18px}

/* Resumen */
.page-h{font-family:var(--f-head);font-weight:600;font-size:clamp(19px,2.6vw,24px);letter-spacing:-.02em;margin:4px 0 14px}
.rs{display:grid;gap:16px}
@media(min-width:900px){.rs{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:20px;align-items:start}.rs-chart{grid-column:1/-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
@media(max-width:480px){.panel{padding:16px}}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;margin-bottom:12px;flex-wrap:wrap}
.panel-h .ttl{display:flex;align-items:center;gap:8px;min-width:0}
.panel h2{font-size:16px;margin:0}
.rs-sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.rs-label{margin:0;color:var(--muted);font-size:14px;font-weight:500}
.rs-num{font-family:var(--f-head);font-weight:700;font-size:clamp(34px,8.6vw,56px);line-height:1.05;letter-spacing:-.035em;margin:6px 0 8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rs-note{margin:0 0 20px;color:var(--muted);font-size:15px;max-width:46ch}
.flow{position:relative;margin-top:2px}
.flow-t{position:relative;height:14px}
.flow-fill{display:flex;height:100%;border-radius:99px;background:var(--inc-bg);overflow:hidden}
.flow-fill i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.flow-fill .f-ok{background:var(--exp)}
.flow-fill .f-over{background:repeating-linear-gradient(135deg,var(--exp) 0 4px,color-mix(in srgb,var(--exp) 38%,var(--surface)) 4px 8px)}
.f-lim{position:absolute;top:-5px;bottom:-5px;left:var(--l);width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.flow-lim{display:block;position:relative;height:22px;margin-top:6px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.flow-lim{width:max(var(--l),7.5em);text-align:right;padding-right:7px;box-sizing:border-box}
.flow-cap{display:flex;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;margin-top:2px;font-size:14px;color:var(--muted)}
.flow-cap b{color:var(--ink);font-weight:600}
.flow-cap b.exp{color:var(--exp)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.exp{background:var(--exp)} .sw.inc{background:var(--inc)}
.sw.over{background:repeating-linear-gradient(135deg,var(--exp) 0 3px,color-mix(in srgb,var(--exp) 38%,var(--surface)) 3px 6px)}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;border-top:1px solid var(--line)}
.stat{display:grid;gap:2px;padding:16px 0 0;align-content:start;min-width:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:16px}
.stat-l{font-size:14px;color:var(--muted);font-weight:500}
.stat strong{font-family:var(--f-head);font-weight:600;font-size:clamp(17px,4.6vw,22px);letter-spacing:-.02em;overflow-wrap:anywhere}
.stat small{display:grid;margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.35}
.stat small.diff em{font-style:normal;font-size:13px;margin-top:1px}
.stat small.diff em.good{color:var(--inc)} .stat small.diff em.bad{color:var(--exp)}
.stat small b{font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap}
.split{display:flex;height:12px;gap:2px}
.split i{display:block;height:100%;border-radius:3px}
.split i:first-child{border-radius:99px 3px 3px 99px}
.split i:last-child{border-radius:3px 99px 99px 3px}
.c1{background:var(--c1)} .c2{background:var(--c2)} .c3{background:var(--c3)}
.rule-list{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:22px minmax(0,1fr) auto auto}
.rule-list li{display:contents}
.rule-list li>*{display:flex;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rule-list li:first-child>*{border-top:0}
.dot{width:10px;height:10px;border-radius:3px;display:block}
.rl-n{font-weight:600}
.rule-list .rl-p{justify-content:flex-end;padding-left:12px;color:var(--muted);font-size:14px}
.rule-list .rl-a{justify-content:flex-end;padding-left:16px;font-family:var(--f-head);font-weight:600;font-size:16px;letter-spacing:-.01em}
.saved{margin-top:4px;padding-top:14px;border-top:1px solid var(--line)}
.saved-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;font-weight:500}
.saved-h b{font-family:var(--f-head);font-weight:600;font-size:16px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--eq)}
.bar i.inc{background:var(--inc)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:176px;background:
  linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 74px/100% 1px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 148px/100% 1px no-repeat}
.bcol{display:flex;flex-direction:column;border:0;background:none;padding:0;border-radius:10px;cursor:pointer;height:176px;min-width:0}
.bcol:hover{background:var(--soft)}
.bcol[aria-pressed="true"]{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.bpair{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:148px}
.bpair i{display:block;width:min(18px,36%);border-radius:4px 4px 0 0;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.bi{background:var(--inc)} .be{background:var(--exp)}
.bl{height:28px;line-height:28px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:500}
.bcol[aria-pressed="true"] .bl{color:var(--ink);font-weight:700}
.msum{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.msum>b{color:var(--ink);font-weight:700;font-family:var(--f-head);font-size:14px}
.msum span b{font-weight:600}
.rs-data{margin-top:16px;border-style:dashed;background:transparent}
.data-row{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.data-row h2{font-size:14.5px;margin:0 0 2px}
.data-row p{margin:0}
.btn.sm{min-height:40px;padding:8px 14px;font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Detalle: tablas y acordeones */
.dt-grid{display:grid;gap:16px}
@media(min-width:1000px) and (max-width:1179px),(min-width:1280px){.dt-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}}
.dt-con.panel{margin-top:16px}
.tbl.dt{font-size:14px}
.tbl.dt th{padding:0 0 10px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl.dt td{padding:12px 0;border-top:1px solid var(--line)}
.tbl.dt tbody tr:first-child td{border-top:0}
.tbl.dt td.n{padding-left:14px}
.tbl.dt td.nm{font-weight:600;padding-right:12px}
.tbl.dt td.rl{font-weight:600}
.tbl.dt tfoot td{border-top:2px solid var(--line);padding-top:14px;font-weight:700}
.tbl.dt .cpb{height:5px;margin-top:6px;max-width:220px}
.cpb{display:none}
.tbl.dt .paybtn{box-sizing:border-box;min-height:36px;min-width:84px;padding:6px 14px;font-size:13px;justify-content:center}
.tbl.dt td.pay{text-align:center}
@media(min-width:640px){
  .tbl.dt.dt-con{table-layout:fixed}
  .tbl.dt.dt-con th:nth-child(2),.tbl.dt.dt-con th:nth-child(3),.tbl.dt.dt-con th:nth-child(4){width:108px}
  .tbl.dt.dt-con th:nth-child(5){width:96px}
  .tbl.dt.dt-con td.pay{white-space:nowrap}
}
@media(max-width:639px){
  .tbl.dt thead{display:none}
  .tbl.dt,.tbl.dt tbody,.tbl.dt tfoot{display:block}
  .tbl.dt tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm rl" "pp df";gap:3px 14px;padding:13px 0;border-top:1px solid var(--line)}
  .tbl.dt tbody tr:first-child{border-top:0}
  .tbl.dt td,.tbl.dt td.n{display:block;padding:0;border:0;white-space:normal;text-align:left}
  .tbl.dt td.nm{grid-area:nm;font-size:15px}
  .tbl.dt td.rl{grid-area:rl;text-align:right;font-size:15px;font-family:var(--f-head);letter-spacing:-.01em}
  .tbl.dt td.pp{grid-area:pp;font-size:12.5px;color:var(--muted)}
  .tbl.dt td.pp::before{content:'Presupuesto '}
  .tbl.dt td.df{grid-area:df;text-align:right;font-size:12.5px;color:var(--muted)}
  .tbl.dt td.df::before{content:'Diferencia '}
  .tbl.dt.dt-con tr{grid-template-areas:"nm rl" "pp df" "pay pay"}
  .tbl.dt td.pay{grid-area:pay;display:block;margin-top:10px;width:100%}
  .tbl.dt tfoot td.pay{display:none}
  .tbl.dt tfoot tr{border-top:2px solid var(--line);margin-top:4px}
  .tbl.dt tfoot td{border:0;padding:0}
  .tbl.dt .paybtn{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;height:42px;min-height:42px;padding:0 22px;font-size:14px;line-height:1}
  .tbl.dt .cpb{max-width:none}
}
/* Listas de edición agrupadas por categoría */
.lsg{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.lsg+.lsg{margin-top:10px}
.lsg>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;min-height:48px;cursor:pointer;background:var(--soft);font-weight:600}
.lsg>summary::-webkit-details-marker{display:none}
.lsg>summary::before{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:2px;flex:none}
.lsg[open]>summary::before{transform:rotate(45deg)}
.lsg>summary .sn{flex:1;min-width:0;overflow-wrap:anywhere}
.lsg>summary .sv{display:flex;align-items:center;gap:8px;white-space:nowrap}
.lsg>summary .sv b{font-family:var(--f-head);font-weight:600}
.lsg .tag{margin-left:0}
.lsg .tx{box-sizing:border-box;padding:10px 14px;border-top:1px solid var(--line)}
/* Tarjetas */
.tj-grid .panel{min-width:0}
.tj-terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--soft);border:1px solid var(--line);border-radius:14px}
.tj-t{display:grid;gap:2px;align-content:start;min-width:0;padding:12px 14px}
.tj-terms .tj-t+.tj-t{border-left:1px solid var(--line)}
.tj-t span,.tj-l{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.tj-t strong{font-family:var(--f-head);font-weight:600;font-size:clamp(15px,4.2vw,18px);letter-spacing:-.02em;overflow-wrap:anywhere}
.tj-grid .panel-h{flex-wrap:nowrap;align-items:flex-start}
.tj-grid .panel-h h2{margin:0;min-width:0;overflow-wrap:anywhere}
.tj-grid .panel-h .btn{flex:none}
@media(max-width:559px){
  .tj-terms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tj-terms .tj-t:first-child{grid-column:1/-1;border-bottom:1px solid var(--line)}
